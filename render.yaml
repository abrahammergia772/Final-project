# Render Blueprint — Wolaita Sodo Hospital (full stack)
# Deploys two services:
#   1. FastAPI backend (web service, free tier, memory-safe)
#   2. Static frontend (static site, free)
# Import this file (Render → New → Blueprint, connect repo).
services:

  # ============================================================
  # Backend — FastAPI on Render free tier
  # ============================================================
  - type: web
    name: mediq-pro-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 10000 --workers 1 --limit-concurrency 20 --timeout-keep-alive 30"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: LAZY_LOAD
        value: "1"
      - key: SKIP_RF_MODELS
        value: "1"
      - key: CORS_ALLOW_ALL
        value: "1"
      # Backend URL — automatically set by Render; used here so the
      # frontend can discover it at build time if needed.
      - key: SECRET_KEY
        generateValue: true
      # Optional — set in Render dashboard once you create them:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # ============================================================
  # Frontend — static site (HTML/CSS/JS) on Render free tier
  # ============================================================
  - type: web
    name: mediq-pro-frontend
    runtime: static
    rootDir: mediq-pro-frontend
    plan: free
    buildCommand: ""     # pure static — no build step
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      # No special headers needed — this is a static HTML/JS site
      # that talks to the FastAPI backend over CORS.
    envVars:
      # This static site talks to the backend above.
      # The API URL is baked into assets/js/config.js (defaults to
      # the deployed backend URL), but you can override at runtime
      # by visiting /?api=https://your-custom-url
      - key: VITE_API_BASE_URL
        value: "https://final-project-bo4l.onrender.com"
