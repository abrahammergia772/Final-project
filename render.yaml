# Render Blueprint — MedIQ Pro backend
# Import this file (Render → New → Blueprint) or configure a Web Service with:
#   Root Directory : backend
#   Build Command  : pip install -r requirements.txt
#   Start Command  : uvicorn main:app --host 0.0.0.0 --port 10000
services:
  - type: web
    name: mediq-pro-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 10000"
    healthCheckPath: /health
    envVars:
      # --- Supabase (create a project, copy URL + anon key) ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # --- Optional: fetch the >25 MB appointment RF model from a GitHub Release ---
      # - key: MODEL_DOWNLOAD_URLS
      #   value: "appointment_rf=https://github.com/abrahammergia772/Final-project/releases/download/v1-models/rf_appointment.pkl"
      # --- CORS: allow your Netlify / Render frontend origin ---
      - key: CORS_ORIGINS
        sync: false
      - key: SECRET_KEY
        sync: false
