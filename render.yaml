# Render Blueprint — Wolaita Sodo Hospital (full stack)
# Deploys two services:
#   1. FastAPI backend (web service, free tier, memory-safe)
#   2. Static frontend (static site, free)
# Import this file (Render → New → Blueprint, connect repo).
services:

  # ============================================================
  # Backend — FastAPI on Render free tier
  # ============================================================
  - type: web
    name: mediq-pro-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 10000 --workers 1 --limit-concurrency 20 --timeout-keep-alive 30"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: LAZY_LOAD
        value: "1"
      - key: SKIP_RF_MODELS
        value: "1"
      # Set to 1 only for a short local test. Production must list exact origins.
      - key: CORS_ALLOW_ALL
        value: "0"
      # Backend URL — automatically set by Render; used here so the
      # frontend can discover it at build time if needed.
      - key: SECRET_KEY
        generateValue: true
      # Optional — set in Render dashboard once you create them:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Already set on the live service. Never put the key value in this file.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      # Password reset email. Render free blocks SMTP ports 25, 465, and 587.
      # An xkeysib- key sends over HTTPS. An xsmtpsib- key sends on port 2525
      # and also needs the Login from the Brevo SMTP tab.
      # Add these by hand on the existing backend service — a blueprint sync
      # does not create sync:false variables on a service that already exists.
      # Never put the key value in this file.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SMTP_LOGIN
        sync: false
      # Google sign-in. Create an OAuth client at
      # https://console.cloud.google.com/apis/credentials
      # Authorized JavaScript origin: https://wsh-cpug.onrender.com
      # Add the client id here by hand. Never put it in git if you prefer,
      # and never commit a client secret.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: MAIL_FROM
        value: wolaitasodo2026@gmail.com
      - key: MAIL_FROM_NAME
        value: Wolaita Sodo Hospital
      - key: SENDGRID_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false

  # ============================================================
  # Frontend — static site (HTML/CSS/JS) on Render free tier
  # ============================================================
  - type: web
    name: mediq-pro-frontend
    runtime: static
    rootDir: mediq-pro-frontend
    plan: free
    buildCommand: ""     # pure static — no build step
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    # No Vite env injection (there is no build). The API URL lives in
    # mediq-pro-frontend/assets/js/config.js and can be overridden with ?api=
