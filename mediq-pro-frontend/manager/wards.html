<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<meta name="theme-color" content="#0B3A5E" />
<title>Wards & Beds — Wolaita Sodo Hospital</title>
<link rel="icon" type="image/png" href="../assets/images/favicon.png" />
<link rel="stylesheet" href="../assets/css/global.css" />
<link rel="stylesheet" href="../assets/css/sidebar.css" />
<link rel="stylesheet" href="../assets/css/components.css" />
<link rel="stylesheet" href="../assets/css/dashboard.css" />
<link rel="stylesheet" href="../assets/css/modules.css" />
<script src="../assets/js/theme.js"></script>
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>
<div class="mobile-overlay" id="mobileOverlay"></div>
<main class="main-content" id="mainContent">
<header class="topbar" id="topbar" data-title="Wards & Beds"></header>
<section class="page-body">

<p class="page-kicker">Inpatient flow</p>
<p class="page-intro">Register a bed number for any ward. Saved beds stay on this board.</p>

<section class="card mb-4">
  <h3 class="mb-2">Register a bed number</h3>
  <p class="text-sm mb-3" style="color:#6B7280">Enter the bed this role is responsible for. It is saved to Supabase and appears on the board.</p>
  <div class="form-row">
    <div class="form-group"><label>Bed number <span class="req">*</span></label><input class="form-control" id="bedNo" placeholder="e.g. MED-12"></div>
    <div class="form-group"><label>Ward</label>
      <select class="form-control" id="bedWard"><option>Medical</option><option>Surgical</option><option>Maternity</option><option>Pediatrics</option><option>ICU</option><option>Emergency</option></select>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group"><label>Status</label>
      <select class="form-control" id="bedStatus"><option value="available">Available</option><option value="occupied">Occupied</option><option value="cleaning">Cleaning</option><option value="isolation">Isolation</option></select>
    </div>
    <div class="form-group"><label>Patient, if occupied</label><input class="form-control" id="bedPatient" placeholder="Patient name"></div>
  </div>
  <button class="btn btn-primary" type="button" id="btnSaveBed">Save bed number</button>
</section>
<div class="stat-grid" id="bedStats"></div>
<div class="chip-row" id="wardFilters"></div>
<div class="bed-board" id="bedBoard"></div>
<p class="module-note">Training demo for Wolaita Sodo Hospital — this board lists occupied beds only.</p>

</section>
</main>
<div id="modalContainer"></div>
<div id="toastContainer"></div>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/icons.js"></script>
<script src="../assets/js/nav.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  checkSession();
  checkRoleAccess("manager");
  initLayout();
  bootPage();
});
var ICONS = window.ICONS || {};
const STORE_KEY = "wsh_beds_v1";
const WARDS = ["Medical", "Surgical", "Maternity", "Pediatrics", "ICU", "Emergency"];
const SEED = [];
let beds = [];
let filter = "All";

function isOccupied(b) {
  return b && (b.status === "occupied" || b.status === "isolation") && b.patient;
}
function loadBeds() {
  beds = [];
  apiFetch(CONFIG.ENDPOINTS.BEDS).then(function (r) {
    beds = (r.ok && r.data && r.data.items) || [];
    markKnown(CONFIG.ENDPOINTS.BEDS, beds);
    renderBeds();
  });
}
function statusBadge(s) {
  const map = { occupied: "primary", isolation: "danger" };
  const mapAll = { occupied: "primary", isolation: "danger", available: "success", cleaning: "warning" };
  return badge(s || "available", mapAll[s] || "neutral");
}
function renderBeds() {
  const occupied = beds.filter(isOccupied);
  const shown = beds.filter(b => filter === "All" || b.ward === filter);
  const iso = occupied.filter(b => b.status === "isolation").length;
  const wardsUsed = new Set(occupied.map(b => b.ward)).size;
  document.getElementById("bedStats").innerHTML = [
    ["Occupied", String(occupied.length), "primary", "Patients in a bed"],
    ["Isolation", String(iso), iso ? "danger" : "success", iso ? "Precautions in place" : "None in isolation"],
    ["Wards in use", String(wardsUsed), "info", "With at least one patient"],
    ["Showing", String(shown.length), "primary", filter === "All" ? "All occupied beds" : filter]
  ].map(s => `<div class="stat-card ${s[2] === "primary" ? "" : "color-" + (s[2] === "success" ? "success" : s[2] === "danger" ? "danger" : s[2] === "warning" ? "warning" : "info")}"><div class="stat-icon">${ICONS.bed}</div><div><div class="stat-value">${s[1]}</div><div class="stat-label">${s[0]}</div><div class="stat-trend text-gray">${s[3]}</div></div></div>`).join("");
  document.getElementById("wardFilters").innerHTML = ["All"].concat(WARDS).map(w =>
    `<button type="button" class="chip ${filter === w ? "selected" : ""}" data-ward="${esc(w)}">${esc(w)}</button>`).join("");
  document.getElementById("wardFilters").querySelectorAll("[data-ward]").forEach(b => b.onclick = () => { filter = b.dataset.ward; renderBeds(); });
  const board = document.getElementById("bedBoard");
  board.innerHTML = shown.length ? shown.map(b => `
    <button type="button" class="bed-card status-${b.status}" data-bed="${esc(b.id)}">
      <div class="flex-between"><span class="bed-id">${esc(b.id)}</span>${statusBadge(b.status)}</div>
      <div class="bed-meta">${esc(b.ward)}${b.since ? " · " + esc(b.since) : ""}</div>
      <div class="bed-name">${esc(b.patient)}</div>
      <div class="bed-meta">${esc(b.dx || "Occupied")}${b.doctor ? " · " + esc(b.doctor) : ""}</div>
    </button>`).join("") : `<p class="module-note">No occupied beds${filter === "All" ? "." : " in " + esc(filter) + "."}</p>`;
  board.querySelectorAll("[data-bed]").forEach(el => el.onclick = () => openBed(el.dataset.bed));
}
function openBed(id) {
  const b = beds.find(x => x.id === id);
  if (!b) return;
  openModal({
    title: b.id + " · " + b.ward,
    body: `<div class="detail-list">
      <div class="detail-item"><span class="k">Status</span><span class="v">${statusBadge(b.status)}</span></div>
      <div class="detail-item"><span class="k">Patient</span><span class="v">${esc(b.patient)}</span></div>
      <div class="detail-item"><span class="k">Diagnosis</span><span class="v">${esc(b.dx || "—")}</span></div>
      <div class="detail-item"><span class="k">In bed</span><span class="v">${esc(b.since || "—")}</span></div>
      <div class="detail-item"><span class="k">Doctor</span><span class="v">${esc(b.doctor || "—")}</span></div>
      <div class="detail-item"><span class="k">MRN</span><span class="v">${esc(b.mrn || "—")}</span></div>
    </div>
    <p class="module-note">This bed number is saved in Supabase.</p>`,
    footer: `<button class="btn btn-secondary" data-close>Close</button>`
  });
}

function saveBedNumber() {
  const id = document.getElementById("bedNo").value.trim();
  const ward = document.getElementById("bedWard").value;
  const status = document.getElementById("bedStatus").value;
  const patient = document.getElementById("bedPatient").value.trim();
  if (!id) { showToast("Bed number is required", "error"); return; }
  if (status === "occupied" && !patient) { showToast("Enter the patient for an occupied bed", "error"); return; }
  const row = { id: id, ward: ward, status: status, patient: patient, dx: "", since: status === "occupied" ? todayStr() : "", doctor: "", mrn: "" };
  const existing = beds.find(b => b.id === id);
  const done = function (res) {
    if (!res || !res.ok) return;
    if (!existing) beds.unshift(row);
    else Object.assign(existing, row);
    markKnown(CONFIG.ENDPOINTS.BEDS, [row]);
    renderBeds();
    document.getElementById("bedNo").value = "";
    document.getElementById("bedPatient").value = "";
    showToast("Bed " + id + " saved", "success");
  };
  if (existing) persistUpdate(CONFIG.ENDPOINTS.BEDS, id, row).then(done);
  else persistInsert(CONFIG.ENDPOINTS.BEDS, row).then(done);
}

function bootPage() {
  const ICONS = window.ICONS || {};
  window.ICONS = ICONS;
  loadBeds();
  renderBeds();
  const saveBtn = document.getElementById("btnSaveBed");
  if (saveBtn) saveBtn.onclick = saveBedNumber;
}

</script>
<script src="../assets/js/i18n.js"></script>
</body>
</html>
