<style>
.pay-tabs { display: flex; gap: 8px; margin: 12px 0; }
.pay-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; max-height: 360px; overflow: auto; padding: 2px; align-items: stretch; }
.pay-choice { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 4px; width: 100%; height: 100%; min-height: 0; margin: 0; border: 1px solid var(--border); background: var(--white); color: var(--text-strong); border-radius: 10px; padding: 6px 4px; text-align: center; cursor: pointer; font: inherit; }
.pay-choice strong { display: flex; align-items: center; justify-content: center; min-height: 2.4em; color: var(--text-strong); font-size: 11px; line-height: 1.2; font-weight: 650; }
.pay-choice small { display: block; min-height: 1.2em; color: var(--gray); font-size: 10px; font-weight: 500; line-height: 1.2; }
.pay-choice.selected { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-light); }
.pay-logo { display: flex; align-items: center; justify-content: center; width: 100%; height: 28px; flex: 0 0 28px; box-sizing: border-box; padding: 2px 4px; border-radius: 6px; background: #ffffff; color: #06141B; border: 1px solid #E4E7EA; overflow: hidden; }
.pay-logo img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: center center; }
.pay-copy { display: flex; flex-direction: column; gap: 1px; min-height: 0; }
.pay-picked { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; padding: 8px 10px; border: 1px solid var(--primary); border-radius: 12px; background: var(--white); color: var(--text-strong); }
.pay-picked[hidden] { display: none; }
.pay-picked .pay-logo { width: 88px; height: 32px; flex: 0 0 88px; }
.pay-picked strong { display: block; color: var(--text-strong); font-size: 14px; line-height: 1.25; }
.pay-picked small { display: block; color: var(--gray); font-size: 11px; }
.pay-form { margin: 0 0 12px; padding: 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--white); color: var(--text-strong); }
.pay-form[hidden] { display: none; }
.pay-form label { color: var(--text-strong); }
html[data-theme="dark"] .pay-choice,
html[data-theme="dark"] .pay-choice strong,
html[data-theme="dark"] .pay-picked,
html[data-theme="dark"] .pay-picked strong,
html[data-theme="dark"] .pay-form,
html[data-theme="dark"] .pay-form label { color: var(--text-strong); }
html[data-theme="dark"] .pay-choice,
html[data-theme="dark"] .pay-picked,
html[data-theme="dark"] .pay-form { background: var(--white); }
html[data-theme="dark"] .pay-logo { background: #ffffff; border-color: rgba(204, 208, 207, 0.28); }
.pay-note { color: var(--gray); font-size: 12px; margin: 0 0 10px; }
</style>

let BILLS = [];
function billBalance(b) { return Math.max(0, (Number(b.amount) || 0) - (Number(b.paid) || 0)); }
function asPatientBill(row) {
  const amount = Number(row.amount) || 0;
  const paid = Number(row.paid) || 0;
  const raw = String(row.status || "").toLowerCase();
  let status = "pending";
  if ((amount && paid >= amount) || raw === "paid") status = "paid";
  else if (raw === "overdue") status = "overdue";
  if (amount && paid > 0 && paid < amount) status = "pending";
  return {
    id: row.id,
    date: row.date || String(row.created_at || "").slice(0, 10),
    description: row.description || row.service || "Invoice",
    service: row.service || row.description || "Invoice",
    amount: amount,
    paid: paid,
    status: status,
    patient: row.patient || "",
    email: row.email || "",
    method: row.method || ""
  };
}
function loadPageData() {
  Promise.all([
    apiFetch(CONFIG.ENDPOINTS.BILLS, "GET", null, { quiet: true }),
    apiFetch(CONFIG.ENDPOINTS.CASHIER_INVOICES, "GET", null, { quiet: true })
  ]).then(function (results) {
    const merged = {};
    results.forEach(function (res) {
      if (!res || !res.ok || !res.data) return;
      (res.data.items || []).forEach(function (row) {
        const bill = asPatientBill(row);
        if (!bill.id) return;
        const current = merged[bill.id];
        if (!current || bill.paid > current.paid || (bill.paid === current.paid && bill.email && !current.email)) merged[bill.id] = bill;
      });
    });
    BILLS = Object.keys(merged).map(function (id) { return merged[id]; });
    BILLS.sort(function (a, b) { return String(b.date || "").localeCompare(String(a.date || "")); });
    renderBills();
  });
}

function payCatalog(raw) {
  const wallets = (raw && raw.wallets) || PAY_FALLBACK.wallets.map(function (item) { return { name: item[0], note: item[1] }; });

function payInitials(name) {

  if (!parts.length) return "•";
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

      paint();
    }
    ov.querySelector("#payWallets").onclick = function () { setChannel("wallet"); };
    ov.querySelector("#payBanks").onclick = function () { setChannel("bank"); };
    ov.querySelector("#paySearch").oninput = paint;
    paint();
    apiFetch("/bills/payment-methods", "GET", null, { quiet: true }).then(function (res) {
      if (res && res.ok && res.data) catalog = payCatalog(res.data);
      paint();
    });
    ov.querySelector("#payNow").onclick = function () {
      const amount = Number(ov.querySelector("#payAmount").value);
      const phone = channel === "wallet" ? ov.querySelector("#payPhone").value.trim() : "";
      const accountNumber = channel === "bank" ? ov.querySelector("#payAccount").value.trim() : "";
      const other = ov.querySelector("#payOther").value.trim();
      const holder = (session && session.name) || bill.patient || "";
      if (!selected) { showToast("Choose a wallet or bank", "warning"); return; }
      if (!amount || amount <= 0 || amount > due + 0.001) { showToast("Enter an amount up to the balance", "warning"); return; }
      if ((selected === "Other wallet" || selected === "Other bank") && other.length < 2) { showToast("Type the bank or wallet name", "warning"); return; }
      if (channel === "wallet" && !phone) { showToast("Enter the wallet phone number", "warning"); return; }
      if (channel === "bank" && accountNumber.replace(/\D/g, "").length < 8) { showToast("Enter the bank account number", "warning"); return; }
      const button = ov.querySelector("#payNow");
      button.disabled = true;
      apiFetch("/bills/" + encodeURIComponent(bill.id) + "/pay", "POST", {
        method: selected,
        channel: channel,
        amount: amount,
        phone: phone,
        account_name: holder,
        account_number: accountNumber,
        other_name: other
      }).then(function (res) {
        button.disabled = false;
        if (!res.ok) { showToast(res.error || "Payment was not recorded", "error"); return; }
        const data = res.data || {};
        bill.paid = data.paid;
        bill.status = data.status || (data.balance ? "pending" : "paid");
        bill.method = data.method || selected;
        closeModal(ov);
        renderBills();
        loadPageData();
        showToast(data.balance ? "Payment recorded · " + bill.method : "Bill paid · " + bill.method, "success");
        openModal({
          title: "Payment receipt",
          body: `<div class="detail-list">
            <div class="detail-item"><span class="k">Receipt</span><span class="v">${esc(data.receipt || "")}</span></div>
            <div class="detail-item"><span class="k">Invoice</span><span class="v">${esc(bill.id)}</span></div>
            <div class="detail-item"><span class="k">Paid with</span><span class="v">${esc(data.method || selected)}</span></div>
            <div class="detail-item"><span class="k">${channel === "bank" ? "Account" : "Phone"}</span><span class="v">${esc(channel === "bank" ? (data.account_number || accountNumber) : (data.phone || phone))}</span></div>
            <div class="detail-item"><span class="k">Amount</span><span class="v">${formatCurrency(data.amount || amount)}</span></div>
            <div class="detail-item"><span class="k">Balance</span><span class="v">${formatCurrency(data.balance || 0)}</span></div>
          </div>`
        });
      });
    };
  }});
}
function printBill(id) {
  const b = BILLS.find(x => x.id === id);
  const w = window.open("", "_blank");
  w.document.write(`<html><head><title>Receipt ${b.id}</title><style>body{font-family:monospace;padding:40px}.h{text-align:center;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:20px}</style>
</head><body>
    <div class="h"><h2>Wolaita Sodo University Hospital</h2><p>Official Receipt</p></div>
    <p><strong>Receipt No:</strong> ${b.id}</p><p><strong>Date:</strong> ${formatDate(b.date)}</p>
    <p><strong>Description:</strong> ${b.description}</p><p><strong>Amount Paid:</strong> ${formatCurrency(b.paid || b.amount)}</p>
    <p><strong>Status:</strong> PAID ✓</p><p style="margin-top:24px">Thank you! ______</p>
</body></html>`);
  w.document.close(); w.print();
}
function printAll() { showToast("Select a paid bill to print its receipt","info"); }

</script>
