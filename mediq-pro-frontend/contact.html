<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — Wolaita Sodo Hospital</title>
<link rel="icon" type="image/png" href="assets/images/favicon.png" />
<link rel="stylesheet" href="assets/css/global.css" />
<link rel="stylesheet" href="assets/css/landing.css?v=1" />
<script src="assets/js/theme.js"></script>
</head>
<body>
<div class="hmb">
  <div class="hmb-bg"></div>
  <button class="hmb-burger" id="hmbBurger" type="button" aria-label="Open menu" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="7" x2="19" y2="7"/><line x1="5" y1="12" x2="19" y2="12"/><line x1="5" y1="17" x2="19" y2="17"/></svg>
  </button>
  <div class="hmb-overlay" id="hmbOverlay" hidden></div>
  <nav class="hmb-menu" id="hmbMenu" hidden aria-label="Pages">
    <p>Pages</p>
    <a href="index.html">Home <small>Page</small></a>
    <a href="book.html">Book an Appointment <small>Page</small></a>
    <a href="contact.html">Contact <small>Page</small></a>
    <a href="index.html#signin">Sign in <small>Page</small></a>
    <a href="signup.html">Create an account <small>Page</small></a>
  </nav>
  <div class="hmb-main">
    <h1>Contact</h1>
    <section class="hmb-card hmb-page-card">
      <h2>Wolaita Sodo Hospital</h2>
      <p>Wolaita Sodo University Hospital, Wolaita Sodo, South Ethiopia.</p>
      <p>Sign in to send a message to the hospital, or create an account to book care.</p>
      <div class="hmb-actions" style="justify-content:flex-start;gap:10px">
        <a class="hmb-pill" href="index.html#signin">Sign in</a>
      </div>
    </section>
  </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var burger = document.getElementById("hmbBurger");
  var menu = document.getElementById("hmbMenu");
  var overlay = document.getElementById("hmbOverlay");
  function setMenu(open) {
    menu.hidden = !open;
    overlay.hidden = !open;
    document.body.classList.toggle("hmb-open", open);
    burger.setAttribute("aria-expanded", open ? "true" : "false");
    burger.setAttribute("aria-label", open ? "Close menu" : "Open menu");
  }
  burger.addEventListener("click", function () { setMenu(menu.hidden); });
  overlay.addEventListener("click", function () { setMenu(false); });
  document.querySelectorAll("#hmbMenu a").forEach(function (link) {
    link.addEventListener("click", function () { setMenu(false); });
  });
});
</script>
</body>
</html>
