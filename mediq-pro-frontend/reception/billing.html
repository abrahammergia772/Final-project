<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<meta name="theme-color" content="#11212D" />
<title>Cashier — Wolaita Sodo Hospital</title>
<link rel="icon" type="image/png" href="../assets/images/favicon.png" />
<link rel="stylesheet" href="../assets/css/global.css" />
<link rel="stylesheet" href="../assets/css/sidebar.css?v=6" />
<link rel="stylesheet" href="../assets/css/components.css?v=5" />
<link rel="stylesheet" href="../assets/css/dashboard.css?v=6" />
<link rel="stylesheet" href="../assets/css/modules.css" />
<script src="../assets/js/theme.js"></script>
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>
<div class="mobile-overlay" id="mobileOverlay"></div>
<main class="main-content" id="mainContent">
<header class="topbar" id="topbar" data-title="Cashier"></header>
<section class="page-body">

<p class="page-kicker">Cashier</p>
<p class="page-intro">Front-desk billing in ETB — raise an invoice, collect cash, Telebirr, CBE Birr or insurance, and print a receipt.</p>
<div class="stat-grid" id="billStats"></div>
<div class="panel-grid">
  <section class="panel">
    <div class="panel-header"><div><h3>Invoices</h3></div>
      <input class="form-control" id="billSearch" placeholder="Search patient or invoice…" aria-label="Search invoices" style="max-width:240px">
    </div>
    <div class="panel-body no-pad"><div class="table-wrap"><table class="data-table" id="billTable">
      <thead><tr><th>Invoice</th><th>Patient</th><th>Service</th><th>Amount</th><th>Due</th><th>Status</th><th></th></tr></thead>
      <tbody></tbody>
    </table></div></div>
  </section>
  <section class="panel">
    <div class="panel-header"><div><h3>New invoice</h3></div></div>
    <div class="panel-body">
      <div class="form-group"><label>Patient</label><input class="form-control" id="invPatient" placeholder="Full name"></div>
      <div class="form-group"><label>Email</label><input class="form-control" id="invEmail" type="email" placeholder="name@mail.com"></div>
      <div class="form-group"><label>Service</label><input class="form-control" id="invService" placeholder="e.g. Consultation + lab"></div>
      <div class="form-group"><label>Amount (ETB)</label><input class="form-control" id="invAmount" type="number" min="1" step="0.01" placeholder="0.00"></div>
      <button class="btn btn-primary" id="newInv" type="button">Create invoice</button>
      <p class="module-note">The invoice is saved and shown on that patient's bill.</p>
    </div>
  </section>
</div>

</section>
</main>
<div id="modalContainer"></div>
<div id="toastContainer"></div>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/icons.js"></script>
<script src="../assets/js/nav.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/utils.js?v=7"></script>
<script src="../assets/js/shell.js?v=2"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  checkSession();
  checkRoleAccess("reception");
  initLayout();
  bootPage();
});
var ICONS = window.ICONS || {};
const KEY = "wsh_bills_v1";
function seedBills() { return []; }
let bills = [];
function loadB() {
  bills = [];
  apiFetch(CONFIG.ENDPOINTS.CASHIER_INVOICES).then(function (r) {
    bills = (r.ok && r.data && r.data.items) || [];
    markKnown(CONFIG.ENDPOINTS.CASHIER_INVOICES, bills);
    renderBills();
  });
}
function saveB() { bills.forEach(function (b) { persistUpsert(CONFIG.ENDPOINTS.CASHIER_INVOICES, b); }); }
function due(b) { return Math.max(0, Number(b.amount) - (Number(b.paid) || 0)); }
function patientBillFromInvoice(invoice) {
  const paid = Number(invoice.paid) || 0;
  const amount = Number(invoice.amount) || 0;
  return {
    id: invoice.id,
    date: invoice.date || (typeof todayStr === "function" ? todayStr() : ""),
    description: invoice.service,
    amount: amount,
    status: paid >= amount && amount ? "paid" : "pending",
    patient: invoice.patient,
    service: invoice.service,
    method: invoice.method || "",
    paid: paid,
    email: invoice.email || "",
    patient_id: invoice.patient_id || ""
  };
}
function billStatus(b) {
  if (due(b) === 0) return badge("paid", "success");
  if (b.paid > 0) return badge("partial", "warning");
  return badge("unpaid", "danger");
}
function renderBills() {
  const outstanding = bills.reduce((s, b) => s + due(b), 0);
  const collected = bills.reduce((s, b) => s + (Number(b.paid) || 0), 0);
  document.getElementById("billStats").innerHTML = `
    <div class="stat-card"><div class="stat-icon tile-primary">${ICONS.receipt}</div><div><div class="stat-value">${bills.length}</div><div class="stat-label">Open invoices</div></div></div>
    <div class="stat-card color-danger"><div class="stat-icon">${ICONS.alert}</div><div><div class="stat-value">${formatCurrency(outstanding, false)}</div><div class="stat-label">Outstanding ETB</div></div></div>
    <div class="stat-card color-success"><div class="stat-icon">${ICONS.check}</div><div><div class="stat-value">${formatCurrency(collected, false)}</div><div class="stat-label">Collected ETB</div></div></div>
    <div class="stat-card color-info"><div class="stat-icon">${ICONS.wallet}</div><div><div class="stat-value">${bills.filter(b => due(b) === 0).length}</div><div class="stat-label">Fully paid</div></div></div>`;
  const q = (document.getElementById("billSearch").value || "").toLowerCase();
  const rows = bills.filter(b => !q || (b.id + b.patient + (b.email || "") + b.service).toLowerCase().includes(q));
  document.querySelector("#billTable tbody").innerHTML = rows.map(b => `<tr>
    <td>${esc(b.id)}</td><td>${esc(b.patient)}${b.email ? `<div style="color:var(--gray);font-size:12px">${esc(b.email)}</div>` : ""}</td><td>${esc(b.service)}</td>
    <td>${formatCurrency(b.amount)}</td><td>${formatCurrency(due(b))}</td><td>${billStatus(b)}</td>
    <td class="actions">
      ${due(b) ? `<button class="btn btn-primary btn-sm" data-pay="${esc(b.id)}">Collect</button>` : ""}
      <button class="btn btn-secondary btn-sm" data-rcpt="${esc(b.id)}">Receipt</button>
    </td></tr>`).join("") || emptyRow(7, "No invoices.");
  document.querySelectorAll("[data-pay]").forEach(b => b.onclick = () => collect(b.dataset.pay));
  document.querySelectorAll("[data-rcpt]").forEach(b => b.onclick = () => receipt(b.dataset.rcpt));
}
function collect(id) {
  const b = bills.find(x => x.id === id);
  openModal({
    title: "Collect payment · " + id,
    body: `<p class="mb-3">Balance due <strong>${formatCurrency(due(b))}</strong> for ${esc(b.patient)}.</p>
      <div class="form-group"><label>Amount (ETB)</label><input class="form-control" id="payAmt" type="number" min="1" step="0.01" value="${due(b)}"></div>
      <div class="form-group"><label>Method</label><div class="pay-methods">
        ${["Cash", "Telebirr", "CBE Birr", "Insurance"].map((m, i) => `<label><input type="radio" name="paym" value="${m}" ${i === 0 ? "checked" : ""}> ${m}</label>`).join("")}
      </div></div>`,
    footer: `<button class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-primary" id="payOk">Record payment</button>`
  }, { onMount(ov) {
    ov.querySelector("#payOk").onclick = () => {
      const amt = Number(ov.querySelector("#payAmt").value);
      const method = (ov.querySelector("input[name=paym]:checked") || {}).value || "Cash";
      if (!amt || amt <= 0) { showToast("Enter an amount", "warning"); return; }
      b.paid = Math.min(Number(b.amount) || 0, (Number(b.paid) || 0) + amt);
      b.method = method;
      b.status = due(b) === 0 ? "paid" : "pending";
      const payBtn = ov.querySelector("#payOk");
      payBtn.disabled = true;
      Promise.all([
        persistUpdate(CONFIG.ENDPOINTS.CASHIER_INVOICES, b.id, b),
        persistUpdate(CONFIG.ENDPOINTS.BILLS, b.id, patientBillFromInvoice(b))
      ]).then(function (saved) {
        payBtn.disabled = false;
        if (!saved[0] || !saved[0].ok) return;
        closeModal(ov);
        renderBills();
        showToast(saved[1] && saved[1].ok ? "Payment recorded · " + method : "Payment saved on the invoice", "success");
      });
    };
  }});
}
function receipt(id) {
  const b = bills.find(x => x.id === id);
  const w = window.open("", "_blank", "noopener,width=480,height=640");
  if (!w) { showToast("Allow pop-ups to print the receipt", "warning"); return; }
  w.document.write(`<!DOCTYPE html><html><head><title>${esc(b.id)}</title><style>
    body{font-family:Inter,Segoe UI,Arial,sans-serif;padding:28px;color:#111} h1{font-size:18px;margin:0}
    .sub{color:#64748B;font-size:12px;margin-bottom:16px} table{width:100%;border-collapse:collapse;font-size:14px}
    td{padding:8px 0;border-bottom:1px solid #e5e7eb} .tot{font-weight:700;font-size:16px}
  </style></head><body>
    <h1>Wolaita Sodo Hospital</h1><div class="sub">Cashier receipt · ${esc(b.id)} · ${esc(todayStr())}</div>
    <table>
      <tr><td>Patient</td><td>${esc(b.patient)}</td></tr>
      ${b.email ? `<tr><td>Email</td><td>${esc(b.email)}</td></tr>` : ""}
      <tr><td>Service</td><td>${esc(b.service)}</td></tr>
      <tr><td>Amount</td><td>${formatCurrency(b.amount)}</td></tr>
      <tr><td>Paid</td><td>${formatCurrency(b.paid)} ${b.method ? "(" + esc(b.method) + ")" : ""}</td></tr>
      <tr><td class="tot">Balance</td><td class="tot">${formatCurrency(due(b))}</td></tr>
    </table>
    <p class="sub">Demo receipt — not a fiscal invoice.</p>
    <script>window.onload=function(){setTimeout(function(){window.print()},300)}<\/script>
  </body></html>`);
  w.document.close();
}
function bootPage() {
  const ICONS = window.ICONS || {};
  window.ICONS = ICONS;
  loadB();
  document.getElementById("billSearch").oninput = debounce(renderBills, 200);
  document.getElementById("newInv").onclick = () => {
    const patientInput = document.getElementById("invPatient");
    const emailInput = document.getElementById("invEmail");
    const patient = patientInput.value.trim();
    const email = (emailInput.value || patientInput.dataset.email || "").trim();
    const service = document.getElementById("invService").value.trim();
    const amount = Number(document.getElementById("invAmount").value);
    if (!patient || !service || !amount) { showToast("Patient, service and amount are required", "warning"); return; }
    const invoice = {
      id: "INV-" + Date.now().toString(36).toUpperCase(),
      patient: patient,
      patient_id: patientInput.dataset.patientId || "",
      email: email,
      service: service,
      amount: amount,
      paid: 0,
      method: "",
      status: "pending",
      date: typeof todayStr === "function" ? todayStr() : new Date().toISOString().slice(0, 10)
    };
    const button = document.getElementById("newInv");
    const bill = patientBillFromInvoice(invoice);
    button.disabled = true;
    apiFetch(CONFIG.ENDPOINTS.CASHIER_INVOICES, "POST", invoice).then(function (invRes) {
      if (!invRes.ok) {
        button.disabled = false;
        showToast(invRes.error || "Could not save the invoice", "error");
        return;
      }
      apiFetch(CONFIG.ENDPOINTS.BILLS, "POST", bill).then(function (billRes) {
        button.disabled = false;
        bills.unshift(invoice);
        markKnown(CONFIG.ENDPOINTS.CASHIER_INVOICES, [invoice]);
        if (billRes.ok) markKnown(CONFIG.ENDPOINTS.BILLS, [bill]);
        renderBills();
        patientInput.value = "";
        patientInput.dataset.patientId = "";
        patientInput.dataset.patientName = "";
        patientInput.dataset.email = "";
        emailInput.value = "";
        emailInput.dataset.filledFromPatient = "";
        document.getElementById("invService").value = "";
        document.getElementById("invAmount").value = "";
        showToast(billRes.ok ? "Invoice added to the patient bill" : "Invoice saved. It will still show on the patient bill.", billRes.ok ? "success" : "warning");
      });
    });
  };
  renderBills();
}

</script>
<script src="../assets/js/i18n.js"></script>
</body>
</html>
