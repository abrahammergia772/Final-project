<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<meta name="theme-color" content="#0B3A5E" />
<title>Admissions & Beds — Wolaita Sodo Hospital</title>
<link rel="icon" type="image/png" href="../assets/images/favicon.png" />
<link rel="stylesheet" href="../assets/css/global.css" />
<link rel="stylesheet" href="../assets/css/sidebar.css" />
<link rel="stylesheet" href="../assets/css/components.css" />
<link rel="stylesheet" href="../assets/css/dashboard.css" />
<link rel="stylesheet" href="../assets/css/modules.css" />
<script src="../assets/js/theme.js"></script>
</head>
<body>
<aside class="sidebar" id="sidebar"></aside>
<div class="mobile-overlay" id="mobileOverlay"></div>
<main class="main-content" id="mainContent">
<header class="topbar" id="topbar" data-title="Admissions & Beds"></header>
<section class="page-body">

<p class="page-kicker">Inpatient flow</p>
<p class="page-intro">Occupied beds only. Registering and approving a patient who needs a bed is done by the doctor.</p>
<div class="stat-grid" id="bedStats"></div>
<div class="chip-row" id="wardFilters"></div>
<div class="bed-board" id="bedBoard"></div>
<p class="module-note">Training demo for Wolaita Sodo Hospital — this board lists occupied beds only.</p>

</section>
</main>
<div id="modalContainer"></div>
<div id="toastContainer"></div>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/icons.js"></script>
<script src="../assets/js/nav.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  checkSession();
  checkRoleAccess("reception");
  initLayout();
  bootPage();
});
var ICONS = window.ICONS || {};
const STORE_KEY = "wsh_beds_v1";
const WARDS = ["Medical", "Surgical", "Maternity", "Pediatrics", "ICU", "Emergency"];
const SEED = [];
let beds = [];
let filter = "All";

function isOccupied(b) {
  return b && (b.status === "occupied" || b.status === "isolation") && b.patient;
}
function loadBeds() {
  beds = [];
  apiFetch(CONFIG.ENDPOINTS.BEDS).then(function (r) {
    beds = (r.ok && r.data && r.data.items) || [];
    markKnown(CONFIG.ENDPOINTS.BEDS, beds);
    renderBeds();
  });
}
function statusBadge(s) {
  const map = { occupied: "primary", isolation: "danger" };
  return badge(s === "isolation" ? "isolation" : "occupied", map[s] || "primary");
}
function renderBeds() {
  const occupied = beds.filter(isOccupied);
  const shown = occupied.filter(b => filter === "All" || b.ward === filter);
  const iso = occupied.filter(b => b.status === "isolation").length;
  const wardsUsed = new Set(occupied.map(b => b.ward)).size;
  document.getElementById("bedStats").innerHTML = [
    ["Occupied", String(occupied.length), "primary", "Patients in a bed"],
    ["Isolation", String(iso), iso ? "danger" : "success", iso ? "Precautions in place" : "None in isolation"],
    ["Wards in use", String(wardsUsed), "info", "With at least one patient"],
    ["Showing", String(shown.length), "primary", filter === "All" ? "All occupied beds" : filter]
  ].map(s => `<div class="stat-card ${s[2] === "primary" ? "" : "color-" + (s[2] === "success" ? "success" : s[2] === "danger" ? "danger" : s[2] === "warning" ? "warning" : "info")}"><div class="stat-icon">${ICONS.bed}</div><div><div class="stat-value">${s[1]}</div><div class="stat-label">${s[0]}</div><div class="stat-trend text-gray">${s[3]}</div></div></div>`).join("");
  document.getElementById("wardFilters").innerHTML = ["All"].concat(WARDS).map(w =>
    `<button type="button" class="chip ${filter === w ? "selected" : ""}" data-ward="${esc(w)}">${esc(w)}</button>`).join("");
  document.getElementById("wardFilters").querySelectorAll("[data-ward]").forEach(b => b.onclick = () => { filter = b.dataset.ward; renderBeds(); });
  const board = document.getElementById("bedBoard");
  board.innerHTML = shown.length ? shown.map(b => `
    <button type="button" class="bed-card status-${b.status}" data-bed="${esc(b.id)}">
      <div class="flex-between"><span class="bed-id">${esc(b.id)}</span>${statusBadge(b.status)}</div>
      <div class="bed-meta">${esc(b.ward)}${b.since ? " · " + esc(b.since) : ""}</div>
      <div class="bed-name">${esc(b.patient)}</div>
      <div class="bed-meta">${esc(b.dx || "Occupied")}${b.doctor ? " · " + esc(b.doctor) : ""}</div>
    </button>`).join("") : `<p class="module-note">No occupied beds${filter === "All" ? "." : " in " + esc(filter) + "."}</p>`;
  board.querySelectorAll("[data-bed]").forEach(el => el.onclick = () => openBed(el.dataset.bed));
}
function openBed(id) {
  const b = beds.find(x => x.id === id);
  if (!isOccupied(b)) return;
  openModal({
    title: b.id + " · " + b.ward,
    body: `<div class="detail-list">
      <div class="detail-item"><span class="k">Status</span><span class="v">${statusBadge(b.status)}</span></div>
      <div class="detail-item"><span class="k">Patient</span><span class="v">${esc(b.patient)}</span></div>
      <div class="detail-item"><span class="k">Diagnosis</span><span class="v">${esc(b.dx || "—")}</span></div>
      <div class="detail-item"><span class="k">In bed</span><span class="v">${esc(b.since || "—")}</span></div>
      <div class="detail-item"><span class="k">Doctor</span><span class="v">${esc(b.doctor || "—")}</span></div>
      <div class="detail-item"><span class="k">MRN</span><span class="v">${esc(b.mrn || "—")}</span></div>
    </div>
    <p class="module-note">Occupied beds only. Empty beds and new requests are registered and approved by the doctor.</p>`,
    footer: `<button class="btn btn-secondary" data-close>Close</button>`
  });
}
function bootPage() {
  const ICONS = window.ICONS || {};
  window.ICONS = ICONS;
  loadBeds();
  renderBeds();
}

</script>
<script src="../assets/js/i18n.js"></script>
</body>
</html>
