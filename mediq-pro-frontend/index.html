<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — MedIQ Pro</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%231A56DB%22/%3E%3Cpath%20d%3D%22M26%2014h12v12h12v12H38v12H26V38H14V26h12z%22%20fill%3D%22%23fff%22/%3E%3C/svg%3E" />
<link rel="stylesheet" href="assets/css/global.css" />
<link rel="stylesheet" href="assets/css/components.css" />
<link rel="stylesheet" href="assets/css/dashboard.css" />
</head>
<body>
<div class="login-body">
  <div class="login-card">
    <div class="login-logo">
      <img src="assets/images/logo.png" alt="MedIQ Pro logo" />
      <h1>MedIQ <span style="color:var(--primary)">Pro</span></h1>
      <div class="sub">AI-Powered Hospital Management System</div>
    </div>

    <div class="login-error" id="loginError">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
      <span id="loginErrorText">Invalid credentials.</span>
    </div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="loginEmail">Email address</label>
        <input class="form-control" type="email" id="loginEmail" placeholder="you@mediq.pro" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input class="form-control" type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button class="btn btn-primary btn-lg btn-block" type="submit" id="loginBtn">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
        Sign In
      </button>
    </form>

    <div class="login-demo">
      <div class="ld-title">Demo accounts — one-click login (all roles)</div>
      <div class="demo-roles">
        <button class="demo-role" data-role="admin"><span class="dr-icon" style="background:#EFF6FF;color:#1A56DB"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span> Admin</button>
        <button class="demo-role" data-role="manager"><span class="dr-icon" style="background:#F0F9FF;color:#0369A1"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M18 20V4M6 20v-4"/></svg></span> Manager</button>
        <button class="demo-role" data-role="doctor"><span class="dr-icon" style="background:#ECFDF5;color:#065F46"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6 6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"/><path d="M8 15v1a6 6 0 0 0 6 6 6 6 0 0 0 6-6v-4"/><circle cx="20" cy="10" r="2"/></svg></span> Doctor</button>
        <button class="demo-role" data-role="nurse"><span class="dr-icon" style="background:#FFFBEB;color:#D97706"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg></span> Nurse</button>
        <button class="demo-role" data-role="pharmacist"><span class="dr-icon" style="background:#F5F3FF;color:#7C3AED"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg></span> Pharmacist</button>
        <button class="demo-role" data-role="laboratory"><span class="dr-icon" style="background:#FEF2F2;color:#DC2626"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 2v6L4.5 19a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L14 8V2"/><path d="M8.5 2h7M7 15h10"/></svg></span> Laboratory</button>
        <button class="demo-role" data-role="reception"><span class="dr-icon" style="background:#ECFEFF;color:#0891B2"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span> Reception</button>
        <button class="demo-role" data-role="patient"><span class="dr-icon" style="background:#E7F0E9;color:#065F46"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span> Patient</button>
      </div>
    </div>

    <p class="text-center text-sm mt-4" style="color:#9CA3AF">MedIQ Pro v1.0 · Wolaita Sodo University · Demo mode active</p>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/utils.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  checkSession(); // redirect to the correct dashboard if already logged in

  const form = document.getElementById("loginForm");
  const errBox = document.getElementById("loginError");
  const btn = document.getElementById("loginBtn");

  async function doLogin(email, password) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner sm white"></span> Signing in…';
    const res = await login(email, password);
    if (res.ok) {
      showToast("Welcome back, " + getUserName() + "!", "success");
      setTimeout(() => { window.location.href = getRoleRedirect(getUserRole()); }, 500);
    } else {
      errBox.classList.add("show");
      document.getElementById("loginErrorText").textContent = res.error || "Login failed.";
      btn.disabled = false;
      btn.innerHTML = 'Sign In';
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    errBox.classList.remove("show");
    doLogin(document.getElementById("loginEmail").value.trim(),
            document.getElementById("loginPassword").value);
  });

  // One-click demo login
  document.querySelectorAll(".demo-role").forEach(b => {
    b.addEventListener("click", () => {
      const role = b.dataset.role;
      errBox.classList.remove("show");
      showToast("Signing in as " + role + "…", "info");
      doLogin(role + "@mediq.pro", CONFIG.DEMO_ACCOUNTS[role].password);
    });
  });
});
</script>
</body>
</html>
