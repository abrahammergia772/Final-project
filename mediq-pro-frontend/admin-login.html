<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Administrator Login — Wolaita Sodo Hospital</title>
<link rel="icon" type="image/png" href="assets/images/favicon.png" />
<link rel="stylesheet" href="assets/css/global.css" />
<link rel="stylesheet" href="assets/css/components.css" />
<link rel="stylesheet" href="assets/css/dashboard.css" />
</head>
<body>
<div class="login-body">
  <div class="login-card">
    <div class="login-logo">
      <img src="assets/images/logo.png" alt="Wolaita Sodo Hospital logo" />
      <h1 style="font-size:24px">Administrator <span style="color:var(--primary)">Portal</span></h1>
      <div class="sub">Restricted access — system administrators only</div>
    </div>

    <div class="login-error" id="adminError">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
      <span id="adminErrorText">Invalid administrator credentials.</span>
    </div>

    <form id="adminLoginForm" novalidate>
      <div class="form-group">
        <label for="adminEmail">Administrator Email</label>
        <input class="form-control" type="email" id="adminEmail" placeholder="admin@wsh.et" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="adminPassword">Password</label>
        <input class="form-control" type="password" id="adminPassword" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button class="btn btn-primary btn-lg btn-block" type="submit" id="adminBtn">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Sign in as Administrator
      </button>
      <div class="flex-between mt-3" style="font-size:13px;color:#6B7280">
        <a href="index.html">← Staff / patient login</a>
        <a href="forgot-password.html">Forgot password?</a>
      </div>
    </form>

    <div class="login-demo">
      <div class="ld-title">Administrator demo account</div>
      <button class="demo-role" style="width:100%" id="adminDemo">
        <span class="dr-icon" style="background:#EFF6FF;color:#1A56DB"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
        Sign in as Admin (demo)
      </button>
    </div>

    <p class="text-center text-sm mt-4" style="color:#9CA3AF">Wolaita Sodo Hospital v1.0 · Wolaita Sodo University</p>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/utils.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("adminLoginForm");
  const errBox = document.getElementById("adminError");
  const errText = document.getElementById("adminErrorText");
  const btn = document.getElementById("adminBtn");

  function showErr(m) { errText.textContent = m; errBox.classList.add("show"); }
  function ok() { errBox.classList.remove("show"); }

  async function doLogin(email, password) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner sm white"></span> Signing in…';
    const res = await login(email, password);
    if (res.ok) {
      const role = getUserRole();
      if (role !== "admin") {
        // This portal is admin-only — reject other roles
        clearSession();
        showErr("This portal is for administrators only. Use the main login for other roles.");
        btn.disabled = false;
        btn.innerHTML = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Sign in as Administrator';
        return;
      }
      showToast("Welcome, " + getUserName() + "!", "success");
      // One-shot flag: the root page will auto-enter the admin dashboard once,
      // then always show the login page on later visits.
      try { sessionStorage.setItem("mediq_autoenter", "1"); } catch (e) {}
      window.location.replace("./");
    } else {
      showErr(res.error || "Invalid administrator credentials.");
      btn.disabled = false;
      btn.innerHTML = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Sign in as Administrator';
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    ok();
    doLogin(document.getElementById("adminEmail").value.trim(),
            document.getElementById("adminPassword").value);
  });

  document.getElementById("adminDemo").addEventListener("click", () => {
    ok();
    doLogin("admin@wsh.et", CONFIG.DEMO_ACCOUNTS.admin.password);
  });
});
</script>
</body>
</html>
